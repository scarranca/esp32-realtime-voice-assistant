; PlatformIO Project Configuration File
; XIAO ESP32-S3 AI Voice Assistant (Wake Word: "Hi ESP")
; Seeed Studio XIAO ESP32-S3 (8MB Flash, 8MB PSRAM)
; Uses pioarduino platform for ESP-SR (WakeNet9) support

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
build_unflags = -Werror=all
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DCONFIG_SR_WN_MODEL_WN9_HIESP=y
	-DCONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
	-DCONFIG_ESP32S3_DATA_CACHE_64KB=y
	-DCONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
	-Wno-maybe-uninitialized
	-Wno-missing-field-initializers
lib_deps =
	gilmaimon/ArduinoWebsockets@^0.5.4
